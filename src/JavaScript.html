<script>
const ASSET_BASE = 'https://raw.githubusercontent.com/ROK-Lagertha/kd3903-flag-filler-registry/main/assets/';
const I18N={
en:{subtitle:'Register and manage approved CH25 Flag Fillers for DKP and Kingdom Cleanup protection.',motto:'ONE KINGDOM. ONE FAMILY. NO DRAMA.',register:'REGISTER',registerInfo:'Register your Flag Filler. One active Flag Filler per Main account.',rename:'RENAME',renameInfo:'Update your Main and/or Flag Filler name. Governor IDs remain unchanged.',remove:'REMOVE',removeInfo:'Remove your Flag Filler registration. Protection ends immediately.',mainId:'Main Governor ID',mainName:'Main Name',flagId:'Flag Filler Governor ID',flagName:'Flag Filler Name',removalCode:'Removal Code',newMainName:'New Main Name (optional)',newFlagName:'New Flag Filler Name (optional)',registerButton:'REGISTER',renameButton:'UPDATE NAMES',removeButton:'REMOVE',success:'Registration successful.',saveCode:'Save this Removal Code. You will need it for Rename or Remove.',renamed:'Names updated successfully.',removed:'Flag Filler removed successfully.',ok:'OK'},
de:{subtitle:'Registriere und verwalte genehmigte CH25 Flag Filler für den Schutz bei DKP-Prüfungen und Kingdom Cleanup.',motto:'EIN KÖNIGREICH. EINE FAMILIE. KEIN DRAMA.',register:'REGISTRIEREN',registerInfo:'Registriere deinen Flag Filler. Ein aktiver Flag Filler pro Main Account.',rename:'UMBENENNEN',renameInfo:'Ändere den Namen deines Mains und/oder Flag Fillers. Die Governor IDs bleiben unverändert.',remove:'LÖSCHEN',removeInfo:'Lösche deine Flag-Filler-Registrierung. Der Schutz endet sofort.',mainId:'Main Governor ID',mainName:'Main Name',flagId:'Flag Filler Governor ID',flagName:'Flag Filler Name',removalCode:'Löschcode',newMainName:'Neuer Main Name (optional)',newFlagName:'Neuer Flag Filler Name (optional)',registerButton:'REGISTRIEREN',renameButton:'NAMEN AKTUALISIEREN',removeButton:'LÖSCHEN',success:'Registrierung erfolgreich.',saveCode:'Speichere diesen Löschcode. Du brauchst ihn zum Umbenennen oder Löschen.',renamed:'Namen erfolgreich aktualisiert.',removed:'Flag Filler erfolgreich gelöscht.',ok:'OK'},
ru:{subtitle:'Регистрация и управление одобренными CH25 Flag Filler для защиты при DKP и Kingdom Cleanup.',motto:'ОДНО КОРОЛЕВСТВО. ОДНА СЕМЬЯ. БЕЗ ДРАМЫ.',register:'РЕГИСТРАЦИЯ',registerInfo:'Зарегистрируйте Flag Filler. Один активный Flag Filler на основной аккаунт.',rename:'ИЗМЕНИТЬ ИМЯ',renameInfo:'Измените имя основного аккаунта и/или Flag Filler. ID губернаторов не меняются.',remove:'УДАЛИТЬ',removeInfo:'Удалите регистрацию Flag Filler. Защита прекращается сразу.',mainId:'ID основного губернатора',mainName:'Имя основного аккаунта',flagId:'ID Flag Filler',flagName:'Имя Flag Filler',removalCode:'Код удаления',newMainName:'Новое имя основного аккаунта (необязательно)',newFlagName:'Новое имя Flag Filler (необязательно)',registerButton:'ЗАРЕГИСТРИРОВАТЬ',renameButton:'ОБНОВИТЬ ИМЕНА',removeButton:'УДАЛИТЬ',success:'Регистрация выполнена.',saveCode:'Сохраните код. Он нужен для изменения имени или удаления.',renamed:'Имена успешно обновлены.',removed:'Flag Filler успешно удалён.',ok:'OK'},
tr:{subtitle:'DKP ve Kingdom Cleanup koruması için onaylı CH25 Flag Filler hesaplarını kaydedin ve yönetin.',motto:'TEK KRALLIK. TEK AİLE. DRAMA YOK.',register:'KAYDET',registerInfo:'Flag Filler hesabınızı kaydedin. Her ana hesap için bir aktif Flag Filler.',rename:'İSİM DEĞİŞTİR',renameInfo:'Ana hesap ve/veya Flag Filler adını güncelleyin. Governor ID değerleri değişmez.',remove:'SİL',removeInfo:'Flag Filler kaydını silin. Koruma hemen sona erer.',mainId:'Ana Governor ID',mainName:'Ana Hesap Adı',flagId:'Flag Filler Governor ID',flagName:'Flag Filler Adı',removalCode:'Silme Kodu',newMainName:'Yeni Ana Hesap Adı (isteğe bağlı)',newFlagName:'Yeni Flag Filler Adı (isteğe bağlı)',registerButton:'KAYDET',renameButton:'İSİMLERİ GÜNCELLE',removeButton:'SİL',success:'Kayıt başarılı.',saveCode:'Bu silme kodunu saklayın. İsim değiştirme veya silme için gerekir.',renamed:'İsimler başarıyla güncellendi.',removed:'Flag Filler başarıyla silindi.',ok:'Tamam'}
};
let lang='en';
function t(k){return (I18N[lang]&&I18N[lang][k])||I18N.en[k]||k}
function init(){
 document.getElementById('heroBanner').src=ASSET_BASE+'kd3903-banner.gif';
 const s=document.getElementById('language');
 [['en','EN'],['de','DE'],['ru','RU'],['tr','TR']].forEach(x=>s.add(new Option(x[1],x[0])));
 const browser=(navigator.language||'en').slice(0,2); lang=I18N[browser]?browser:'en'; s.value=lang;
 s.onchange=()=>{lang=s.value;renderLanguage()}; renderLanguage();
}
function renderLanguage(){document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n))}
function setBusy(id,b){const x=document.getElementById(id);if(x)x.disabled=b}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function friendlyError(e){
 const c=String((e&&e.message)||e||'');
 const m={MAIN_ALREADY_REGISTERED:'This Main Governor already has an active Flag Filler.',FLAG_ALREADY_REGISTERED:'This Flag Filler is already registered.',MAIN_AND_FLAG_MUST_DIFFER:'Main Governor ID and Flag Filler ID must be different.',INVALID_GOVERNOR_ID:'Please enter valid numeric Governor IDs.',INVALID_GOVERNOR_NAME:'Please enter valid Governor names.',INVALID_REMOVAL_CODE:'The Removal Code is incorrect.',REMOVAL_CODE_REQUIRED:'A Removal Code is required.',REGISTRATION_NOT_FOUND:'No matching active registration was found.',NO_NAME_CHANGE:'Enter at least one new name.'};
 const k=Object.keys(m).find(k=>c.includes(k)); return k?m[k]:c;
}
function showResult(html){const r=document.getElementById('result');r.innerHTML=html+'<button class="gold-button" onclick="this.parentElement.classList.add(\'hidden\')">'+esc(t('ok'))+'</button>';r.classList.remove('hidden');r.scrollIntoView({behavior:'smooth',block:'center'})}
function submitRegistration(){
 setBusy('registerButton',true);
 google.script.run.withSuccessHandler(r=>{setBusy('registerButton',false);showResult('<h3>✓ '+esc(t('success'))+'</h3><p>'+esc(t('saveCode'))+'</p><code>'+esc(r.removalCode)+'</code>')}).withFailureHandler(e=>{setBusy('registerButton',false);showResult('<h3>✕ Error</h3><p>'+esc(friendlyError(e))+'</p>')}).registerFlagFiller({mainId:mainId.value,mainName:mainName.value,flagId:flagId.value,flagName:flagName.value,language:lang});
}
function submitRename(){
 setBusy('renameButton',true);
 google.script.run.withSuccessHandler(()=>{setBusy('renameButton',false);showResult('<h3>✓ '+esc(t('renamed'))+'</h3>')}).withFailureHandler(e=>{setBusy('renameButton',false);showResult('<h3>✕ Error</h3><p>'+esc(friendlyError(e))+'</p>')}).renameFlagFiller({mainId:renameMainId.value,flagId:renameFlagId.value,removalCode:renameRemovalCode.value,mainName:renameMainName.value,flagName:renameFlagName.value,language:lang});
}
function submitRemoval(){
 setBusy('removeButton',true);
 google.script.run.withSuccessHandler(()=>{setBusy('removeButton',false);showResult('<h3>✓ '+esc(t('removed'))+'</h3>')}).withFailureHandler(e=>{setBusy('removeButton',false);showResult('<h3>✕ Error</h3><p>'+esc(friendlyError(e))+'</p>')}).removeFlagFiller({mainId:removeMainId.value,flagId:removeFlagId.value,removalCode:removalCode.value,language:lang});
}
init();
</script>
