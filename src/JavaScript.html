let lang='en';
function t(k){return (I18N[lang]&&I18N[lang][k])||I18N.en[k]||k}
function init(){
 document.getElementById('heroBanner').src=ASSET_BASE+'kd3903-banner.gif';
 const s=document.getElementById('language');
 [['en','🇬🇧 EN'],['de','🇩🇪 DE'],['ru','🇷🇺 RU'],['tr','🇹🇷 TR'],['fr','🇫🇷 FR'],['ms','🇲🇾 Bahasa Melayu'],['fi','🇫🇮 Suomi'],['uk','🇺🇦 Українська'],['uz','🇺🇿 O‘zbekcha'],['id','🇮🇩 Bahasa Indonesia']].forEach(x=>s.add(new Option(x[1],x[0])));
 lang='en'; s.value='en';
 const faq=document.getElementById('faqNav'); if(faq) faq.addEventListener('click',showFaq);
 s.onchange=()=>{lang=s.value;renderLanguage()}; renderLanguage();
}
function renderLanguage(){document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n)); const fv=document.getElementById('faqView'); if(fv&&!fv.classList.contains('hidden')) renderFaq();}
function openMobileCard(card){
 if(window.innerWidth>980)return;
 document.querySelectorAll('.action-card').forEach(c=>{if(c!==card)c.classList.remove('mobile-open')});
 card.classList.add('mobile-open');
}
document.addEventListener('click',e=>{
 if(e.target.matches('input,select,button')) e.stopPropagation();
});
function setBusy(id,b){const x=document.getElementById(id);if(x)x.disabled=b}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}

const FAQS={
 en:[
 ['What is the Flag Filler Registry?','The Registry is the official KD3903 list of approved CH25 Flag Filler accounts. It allows leadership to identify which Flag Filler belongs to which Main Governor.'],
 ['Why do I need to register my Flag Filler?','Every approved Flag Filler must be registered so leadership can distinguish legitimate Flag Fillers from regular CH25 farms during kingdom reviews and cleanups.'],
 ['Does registration protect my Flag Filler from Kingdom Cleanup?','Registration identifies your account as an approved Flag Filler, but it does not guarantee permanent protection. Your Flag Filler must still meet all applicable KD3903 requirements.'],
 ['Does my Flag Filler have to meet Death Requirements?','Yes. Flag Fillers are expected to contribute deaths during KvK. A CH25 Flag Filler that does not meet the required Death Requirements may be required to leave the kingdom.'],
 ['Why are Death Requirements mandatory?','A Flag Filler exists to support the kingdom during war. A CH25 account occupying kingdom power and account capacity without fulfilling that role is an unnecessary CH25 farm rather than a contributing Flag Filler.'],
 ['How many Flag Fillers can I register?','One active Flag Filler per Main Governor. Each Flag Filler Governor ID can belong to only one active registration.'],
 ['What is the Registry Code?','The Registry Code is generated when you register. You need it to rename or remove your registration. Keep it safe.'],
 ['I renamed my Main or Flag Filler. What should I do?','Use Rename. Enter both Governor IDs and your Registry Code, then update one or both account names. Governor IDs remain unchanged.'],
 ['I want to use a different Flag Filler. What should I do?','Remove your current registration first and then register the new Flag Filler.'],
 ['Can I change the Governor IDs?','No. Governor IDs uniquely identify the accounts. To use another Flag Filler, remove the existing registration and create a new one.'],
 ['What happens when I remove my Flag Filler?','It is removed from the active Flag Filler list. The historical record remains available to leadership for administrative purposes.'],
 ['I lost my Registry Code. What should I do?','Contact KD3903 leadership. Do not create duplicate registrations.'],
 ['What data is stored?','The Registry stores Main and Flag Filler Governor IDs and names, registration status, selected language and administrative timestamps. The information is used for KD3903 kingdom administration.']
 ],
 de:[
 ['Was ist die Flag Filler Registry?','Die Registry ist die offizielle KD3903-Liste genehmigter CH25 Flag Filler. So kann die Führung eindeutig erkennen, welcher Flag Filler zu welchem Main Governor gehört.'],
 ['Warum muss ich meinen Flag Filler registrieren?','Jeder genehmigte Flag Filler muss registriert sein, damit legitime Flag Filler bei Prüfungen und Kingdom Cleanups von normalen CH25-Farmen unterschieden werden können.'],
 ['Schützt die Registrierung meinen Flag Filler vor dem Kingdom Cleanup?','Die Registrierung kennzeichnet deinen Account als genehmigten Flag Filler, garantiert aber keinen dauerhaften Schutz. Dein Flag Filler muss weiterhin alle geltenden KD3903-Anforderungen erfüllen.'],
 ['Muss mein Flag Filler die Death Requirements erfüllen?','Ja. Flag Filler müssen im KvK Tode beitragen. Ein CH25 Flag Filler, der die erforderlichen Death Requirements nicht erfüllt, kann aufgefordert werden, das Königreich zu verlassen.'],
 ['Warum sind Death Requirements verpflichtend?','Ein Flag Filler soll das Königreich im Krieg unterstützen. Ein CH25-Account, der Kingdom Power und Account-Kapazität belegt, ohne diese Aufgabe zu erfüllen, ist eine unnötige CH25-Farm statt eines beitragenden Flag Fillers.'],
 ['Wie viele Flag Filler darf ich registrieren?','Ein aktiver Flag Filler pro Main Governor. Jede Flag Filler Governor ID darf außerdem nur einer aktiven Registrierung zugeordnet sein.'],
 ['Was ist der Registrierungscode?','Der Registrierungscode wird bei der Registrierung erzeugt. Du benötigst ihn zum Umbenennen oder Entfernen deiner Registrierung. Bewahre ihn sicher auf.'],
 ['Ich habe meinen Main oder Flag Filler umbenannt. Was muss ich tun?','Nutze Rename. Gib beide Governor IDs und deinen Registrierungscode ein und aktualisiere einen oder beide Namen. Die Governor IDs bleiben unverändert.'],
 ['Ich möchte einen anderen Flag Filler verwenden. Was muss ich tun?','Entferne zuerst deine aktuelle Registrierung und registriere anschließend den neuen Flag Filler.'],
 ['Kann ich die Governor IDs ändern?','Nein. Governor IDs identifizieren die Accounts eindeutig. Für einen anderen Flag Filler musst du die bestehende Registrierung entfernen und eine neue anlegen.'],
 ['Was passiert, wenn ich meinen Flag Filler entferne?','Er wird aus der aktiven Flag-Filler-Liste entfernt. Der historische Datensatz bleibt für administrative Zwecke der Führung erhalten.'],
 ['Ich habe meinen Registrierungscode verloren. Was soll ich tun?','Wende dich an die KD3903-Führung. Bitte erstelle keine doppelte Registrierung.'],
 ['Welche Daten werden gespeichert?','Gespeichert werden Governor IDs und Namen von Main und Flag Filler, Registrierungsstatus, ausgewählte Sprache und administrative Zeitstempel. Die Daten werden für die Verwaltung von KD3903 verwendet.']
 ],
 fr:[
 ['Qu’est-ce que le Flag Filler Registry ?','Le Registry est la liste officielle de KD3903 des comptes CH25 Flag Filler approuvés. Il permet au leadership d’identifier à quel Main Governor appartient chaque Flag Filler.'],
 ['Pourquoi dois-je enregistrer mon Flag Filler ?','Chaque Flag Filler approuvé doit être enregistré afin de le distinguer des fermes CH25 ordinaires lors des contrôles et Kingdom Cleanups.'],
 ['L’enregistrement protège-t-il mon Flag Filler du Kingdom Cleanup ?','Il identifie le compte comme Flag Filler approuvé, mais ne garantit pas une protection permanente. Le compte doit toujours respecter les exigences de KD3903.'],
 ['Mon Flag Filler doit-il remplir les Death Requirements ?','Oui. Les Flag Fillers doivent contribuer des morts pendant le KvK. Un Flag Filler CH25 qui ne remplit pas les Death Requirements peut être tenu de quitter le royaume.'],
 ['Pourquoi les Death Requirements sont-ils obligatoires ?','Un Flag Filler existe pour soutenir le royaume pendant la guerre. Un compte CH25 qui occupe de la puissance et de la capacité sans remplir ce rôle est une ferme CH25 inutile plutôt qu’un Flag Filler contributeur.'],
 ['Combien de Flag Fillers puis-je enregistrer ?','Un Flag Filler actif par Main Governor. Chaque Governor ID de Flag Filler ne peut appartenir qu’à un seul enregistrement actif.'],
 ['Qu’est-ce que le code d’enregistrement ?','Il est généré lors de l’enregistrement et est nécessaire pour renommer ou supprimer votre enregistrement. Conservez-le en lieu sûr.'],
 ['J’ai renommé mon Main ou mon Flag Filler. Que faire ?','Utilisez Rename, saisissez les deux Governor IDs et votre code d’enregistrement, puis modifiez un nom ou les deux. Les Governor IDs restent inchangés.'],
 ['Je veux utiliser un autre Flag Filler. Que faire ?','Supprimez d’abord l’enregistrement actuel, puis enregistrez le nouveau Flag Filler.'],
 ['Puis-je modifier les Governor IDs ?','Non. Pour utiliser un autre Flag Filler, supprimez l’enregistrement existant et créez-en un nouveau.'],
 ['Que se passe-t-il si je supprime mon Flag Filler ?','Il est retiré de la liste active. L’historique reste disponible au leadership à des fins administratives.'],
 ['J’ai perdu mon code d’enregistrement. Que faire ?','Contactez le leadership de KD3903. Ne créez pas d’enregistrement en double.'],
 ['Quelles données sont enregistrées ?','Le Registry conserve les Governor IDs et noms du Main et du Flag Filler, le statut, la langue sélectionnée et les horodatages administratifs. Ces données servent à l’administration de KD3903.']
 ],
 ms:[
 ['Apakah Flag Filler Registry?','Registry ialah senarai rasmi KD3903 bagi akaun CH25 Flag Filler yang diluluskan. Ia membolehkan leadership mengenal pasti Flag Filler milik Main Governor yang mana.'],
 ['Mengapa saya perlu mendaftarkan Flag Filler?','Setiap Flag Filler yang diluluskan mesti didaftarkan supaya leadership boleh membezakannya daripada farm CH25 biasa semasa semakan dan Kingdom Cleanup.'],
 ['Adakah pendaftaran melindungi Flag Filler daripada Kingdom Cleanup?','Pendaftaran mengenal pasti akaun sebagai Flag Filler yang diluluskan, tetapi tidak menjamin perlindungan kekal. Akaun masih perlu memenuhi semua syarat KD3903.'],
 ['Adakah Flag Filler perlu memenuhi Death Requirements?','Ya. Flag Filler perlu menyumbang deaths semasa KvK. Flag Filler CH25 yang gagal memenuhi Death Requirements mungkin dikehendaki meninggalkan kingdom.'],
 ['Mengapa Death Requirements diwajibkan?','Flag Filler bertujuan menyokong kingdom semasa perang. Akaun CH25 yang menggunakan kingdom power dan kapasiti akaun tanpa memenuhi peranan itu ialah farm CH25 yang tidak diperlukan, bukannya Flag Filler yang menyumbang.'],
 ['Berapa banyak Flag Filler boleh saya daftarkan?','Satu Flag Filler aktif bagi setiap Main Governor. Setiap Flag Filler Governor ID juga hanya boleh berada dalam satu pendaftaran aktif.'],
 ['Apakah Kod Pendaftaran?','Kod Pendaftaran dijana semasa anda mendaftar. Anda memerlukannya untuk menukar nama atau memadam pendaftaran. Simpan dengan selamat.'],
 ['Saya menukar nama Main atau Flag Filler. Apa perlu dibuat?','Gunakan Rename. Masukkan kedua-dua Governor ID dan Kod Pendaftaran, kemudian kemas kini satu atau kedua-dua nama. Governor ID tidak berubah.'],
 ['Saya mahu menggunakan Flag Filler lain. Apa perlu dibuat?','Padam pendaftaran semasa terlebih dahulu, kemudian daftarkan Flag Filler baharu.'],
 ['Bolehkah saya menukar Governor ID?','Tidak. Governor ID mengenal pasti akaun secara unik. Untuk menggunakan Flag Filler lain, padam pendaftaran sedia ada dan buat pendaftaran baharu.'],
 ['Apa berlaku apabila saya memadam Flag Filler?','Ia dikeluarkan daripada senarai Flag Filler aktif. Rekod sejarah kekal tersedia kepada leadership untuk tujuan pentadbiran.'],
 ['Saya kehilangan Kod Pendaftaran. Apa perlu dibuat?','Hubungi leadership KD3903. Jangan buat pendaftaran pendua.'],
 ['Apakah data yang disimpan?','Registry menyimpan Governor ID dan nama Main serta Flag Filler, status pendaftaran, bahasa yang dipilih dan cap masa pentadbiran. Maklumat digunakan untuk pentadbiran KD3903.']
 ]
,
 fi:[
 ['Mikä Flag Filler Registry on?','Registry on KD3903:n virallinen lista hyväksytyistä CH25 Flag Filler -tileistä. Sen avulla johto näkee, mikä Flag Filler kuuluu millekin Main Governorille.'],
 ['Miksi minun pitää rekisteröidä Flag Fillerini?','Jokainen hyväksytty Flag Filler on rekisteröitävä, jotta johto voi erottaa oikeat Flag Fillerit tavallisista CH25-farmeista tarkistusten ja Kingdom Cleanupin aikana.'],
 ['Suojaako rekisteröinti Flag Fillerini Kingdom Cleanupilta?','Rekisteröinti tunnistaa tilisi hyväksytyksi Flag Filleriksi, mutta se ei takaa pysyvää suojaa. Flag Fillerin on edelleen täytettävä kaikki KD3903:n vaatimukset.'],
 ['Pitääkö Flag Fillerin täyttää Death Requirements -vaatimukset?','Kyllä. Flag Fillerien odotetaan tuottavan deaths-tulosta KvK:ssa. CH25 Flag Filler, joka ei täytä vaadittuja Death Requirements -vaatimuksia, voidaan velvoittaa poistumaan kuningaskunnasta.'],
 ['Miksi Death Requirements ovat pakollisia?','Flag Fillerin tarkoitus on tukea kuningaskuntaa sodassa. CH25-tili, joka käyttää kingdom poweria ja tilikapasiteettia täyttämättä tätä tehtävää, on tarpeeton CH25-farmi eikä osallistuva Flag Filler.'],
 ['Kuinka monta Flag Filleriä voin rekisteröidä?','Yksi aktiivinen Flag Filler jokaista Main Governoria kohden. Yksi Flag Filler Governor ID voi kuulua vain yhteen aktiiviseen rekisteröintiin.'],
 ['Mikä rekisteröintikoodi on?','Rekisteröintikoodi luodaan rekisteröinnin yhteydessä. Tarvitset sitä rekisteröinnin nimeämiseen uudelleen tai poistamiseen. Säilytä se turvallisesti.'],
 ['Nimesin Mainin tai Flag Fillerin uudelleen. Mitä teen?','Käytä Rename-toimintoa. Syötä molemmat Governor ID:t ja rekisteröintikoodisi, ja päivitä toinen tai molemmat nimet. Governor ID:t eivät muutu.'],
 ['Haluan käyttää toista Flag Filleriä. Mitä teen?','Poista ensin nykyinen rekisteröinti ja rekisteröi sen jälkeen uusi Flag Filler.'],
 ['Voinko vaihtaa Governor ID:t?','Et. Governor ID:t tunnistavat tilit yksilöllisesti. Jos haluat käyttää toista Flag Filleriä, poista nykyinen rekisteröinti ja luo uusi.'],
 ['Mitä tapahtuu, kun poistan Flag Fillerini?','Se poistetaan aktiivisten Flag Fillerien listalta. Historiatieto säilyy johdon hallinnollista käyttöä varten.'],
 ['Kadotin rekisteröintikoodini. Mitä teen?','Ota yhteyttä KD3903:n johtoon. Älä luo päällekkäistä rekisteröintiä.'],
 ['Mitä tietoja tallennetaan?','Registry tallentaa Mainin ja Flag Fillerin Governor ID:t ja nimet, rekisteröinnin tilan, valitun kielen sekä hallinnolliset aikaleimat. Tietoja käytetään KD3903:n hallinnointiin.']
 ],
 uk:[
 ['Що таке Flag Filler Registry?','Registry — це офіційний список KD3903 зі схваленими CH25 Flag Filler. Він дозволяє керівництву визначити, якому Main Governor належить кожен Flag Filler.'],
 ['Навіщо реєструвати Flag Filler?','Кожен схвалений Flag Filler має бути зареєстрований, щоб керівництво могло відрізнити його від звичайних CH25-ферм під час перевірок і Kingdom Cleanup.'],
 ['Чи захищає реєстрація Flag Filler від Kingdom Cleanup?','Реєстрація позначає акаунт як схвалений Flag Filler, але не гарантує постійного захисту. Він усе одно має виконувати всі чинні вимоги KD3903.'],
 ['Чи повинен Flag Filler виконувати Death Requirements?','Так. Flag Filler мають робити внесок у deaths під час KvK. CH25 Flag Filler, який не виконує Death Requirements, може бути зобов’язаний залишити королівство.'],
 ['Чому Death Requirements обов’язкові?','Flag Filler потрібен для підтримки королівства під час війни. CH25-акаунт, який займає kingdom power і місце, але не виконує цю роль, є непотрібною CH25-фермою, а не корисним Flag Filler.'],
 ['Скільки Flag Filler можна зареєструвати?','Один активний Flag Filler на одного Main Governor. Кожен Flag Filler Governor ID може належати лише одній активній реєстрації.'],
 ['Що таке код реєстрації?','Код створюється під час реєстрації. Він потрібен для перейменування або видалення реєстрації. Зберігайте його в безпечному місці.'],
 ['Я перейменував Main або Flag Filler. Що робити?','Скористайтеся Rename. Введіть обидва Governor ID і код реєстрації, а потім оновіть одне або обидва імені. Governor ID не змінюються.'],
 ['Я хочу використовувати інший Flag Filler. Що робити?','Спочатку видаліть поточну реєстрацію, а потім зареєструйте новий Flag Filler.'],
 ['Чи можна змінити Governor ID?','Ні. Governor ID однозначно ідентифікують акаунти. Для іншого Flag Filler видаліть чинну реєстрацію та створіть нову.'],
 ['Що станеться після видалення Flag Filler?','Він буде вилучений зі списку активних Flag Filler. Історичний запис залишиться доступним керівництву для адміністративних цілей.'],
 ['Я втратив код реєстрації. Що робити?','Зверніться до керівництва KD3903. Не створюйте дубльовану реєстрацію.'],
 ['Які дані зберігаються?','Registry зберігає Governor ID та імена Main і Flag Filler, статус реєстрації, вибрану мову й адміністративні часові позначки. Дані використовуються для адміністрування KD3903.']
 ],
 uz:[
 ['Flag Filler Registry nima?','Registry — KD3903 tomonidan tasdiqlangan CH25 Flag Filler akkauntlarining rasmiy ro‘yxati. U leadershipga qaysi Flag Filler qaysi Main Governorga tegishli ekanini aniqlash imkonini beradi.'],
 ['Nega Flag Fillerni ro‘yxatdan o‘tkazishim kerak?','Har bir tasdiqlangan Flag Filler ro‘yxatdan o‘tishi kerak, shunda leadership tekshiruvlar va Kingdom Cleanup vaqtida haqiqiy Flag Fillerlarni oddiy CH25 farmlardan ajrata oladi.'],
 ['Ro‘yxatdan o‘tish Flag Fillerni Kingdom Cleanupdan himoya qiladimi?','Ro‘yxatdan o‘tish akkauntni tasdiqlangan Flag Filler sifatida belgilaydi, ammo doimiy himoyani kafolatlamaydi. Flag Filler KD3903ning barcha amaldagi talablarini bajarishi kerak.'],
 ['Flag Filler Death Requirements talablarini bajarishi shartmi?','Ha. Flag Filler KvK davomida deaths bilan hissa qo‘shishi kerak. Kerakli Death Requirements talablarini bajarmagan CH25 Flag Filler qirollikni tark etishi talab qilinishi mumkin.'],
 ['Nega Death Requirements majburiy?','Flag Filler urush paytida qirollikni qo‘llab-quvvatlash uchun mavjud. Kingdom power va akkaunt sig‘imini egallab, bu vazifani bajarmaydigan CH25 akkaunt foydali Flag Filler emas, balki keraksiz CH25 farm hisoblanadi.'],
 ['Nechta Flag Fillerni ro‘yxatdan o‘tkazish mumkin?','Har bir Main Governor uchun bitta faol Flag Filler. Har bir Flag Filler Governor ID faqat bitta faol ro‘yxatga tegishli bo‘lishi mumkin.'],
 ['Ro‘yxatga olish kodi nima?','Kod ro‘yxatdan o‘tganingizda yaratiladi. Ro‘yxat nomini o‘zgartirish yoki uni o‘chirish uchun kerak bo‘ladi. Uni xavfsiz saqlang.'],
 ['Main yoki Flag Filler nomini o‘zgartirdim. Nima qilaman?','Rename funksiyasidan foydalaning. Ikkala Governor ID va ro‘yxatga olish kodini kiriting, so‘ng bir yoki ikkala nomni yangilang. Governor ID o‘zgarmaydi.'],
 ['Boshqa Flag Fillerdan foydalanmoqchiman. Nima qilaman?','Avval joriy ro‘yxatni o‘chiring, keyin yangi Flag Fillerni ro‘yxatdan o‘tkazing.'],
 ['Governor IDlarni o‘zgartira olamanmi?','Yo‘q. Governor ID akkauntlarni noyob tarzda aniqlaydi. Boshqa Flag Fillerdan foydalanish uchun mavjud ro‘yxatni o‘chirib, yangisini yarating.'],
 ['Flag Fillerni o‘chirsam nima bo‘ladi?','U faol Flag Fillerlar ro‘yxatidan chiqariladi. Tarixiy yozuv leadership uchun ma’muriy maqsadlarda saqlanadi.'],
 ['Ro‘yxatga olish kodini yo‘qotdim. Nima qilaman?','KD3903 leadershipiga murojaat qiling. Takroriy ro‘yxat yaratmang.'],
 ['Qanday ma’lumotlar saqlanadi?','Registry Main va Flag Filler Governor IDlari va nomlari, ro‘yxat holati, tanlangan til va ma’muriy vaqt belgilarini saqlaydi. Ma’lumotlar KD3903 boshqaruvi uchun ishlatiladi.']
 ]

 ['Saya kehilangan Kode Registrasi. Apa yang harus dilakukan?','Hubungi leadership KD3903. Jangan membuat pendaftaran duplikat.'],
 ['Data apa yang disimpan?','Registry menyimpan Governor ID dan nama Main serta Flag Filler, status pendaftaran, bahasa yang dipilih, dan timestamp administratif. Data digunakan untuk administrasi KD3903.']

FAQS.ru=[
 ['Что такое Flag Filler Registry?','Registry — официальный список KD3903 с одобренными CH25 Flag Filler. Он позволяет руководству определить, какому Main Governor принадлежит каждый Flag Filler.'],
 ['Почему я должен зарегистрировать Flag Filler?','Каждый одобренный Flag Filler должен быть зарегистрирован, чтобы руководство могло отличать его от обычных CH25-ферм во время проверок и Kingdom Cleanup.'],
 ['Защищает ли регистрация Flag Filler от Kingdom Cleanup?','Регистрация подтверждает статус одобренного Flag Filler, но не дает постоянной защиты. Аккаунт по-прежнему должен выполнять все требования KD3903.'],
 ['Должен ли Flag Filler выполнять Death Requirements?','Да. Flag Filler должен вносить вклад deaths во время KvK. CH25 Flag Filler, который не выполняет Death Requirements, может быть обязан покинуть королевство.'],
 ['Почему Death Requirements обязательны?','Flag Filler существует для поддержки королевства во время войны. CH25-аккаунт, занимающий kingdom power и место, но не выполняющий эту роль, является ненужной CH25-фермой.'],
 ['Сколько Flag Filler можно зарегистрировать?','Один активный Flag Filler на одного Main Governor. Каждый Flag Filler Governor ID может принадлежать только одной активной регистрации.'],
 ['Что такое код регистрации?','Код создается при регистрации. Он нужен для переименования или удаления регистрации. Храните его в безопасном месте.'],
 ['Я переименовал Main или Flag Filler. Что делать?','Используйте Rename. Введите оба Governor ID и код регистрации, затем обновите одно или оба имени. Governor ID не меняются.'],
 ['Я хочу использовать другой Flag Filler. Что делать?','Сначала удалите текущую регистрацию, затем зарегистрируйте новый Flag Filler.'],
 ['Можно ли изменить Governor ID существующей регистрации?','Нет. Governor ID однозначно идентифицируют аккаунты. Для другого Flag Filler удалите текущую регистрацию и создайте новую.'],
 ['Что произойдет после удаления Flag Filler?','Он будет удален из списка активных Flag Filler. История останется доступной руководству для административных целей.'],
 ['Я потерял код регистрации. Что делать?','Свяжитесь с руководством KD3903. Не создавайте дублирующую регистрацию.'],
 ['Какие данные хранятся?','Registry хранит Governor ID и имена Main и Flag Filler, статус регистрации, выбранный язык и административные временные метки. Данные используются для администрирования KD3903.']
];
FAQS.tr=[
 ['Flag Filler Registry nedir?','Registry, KD3903 tarafından onaylanmış CH25 Flag Filler hesaplarının resmi listesidir. Leadership hangi Flag Filler’ın hangi Main Governor’a ait olduğunu buradan görebilir.'],
 ['Flag Filler’ımı neden kaydetmeliyim?','Onaylı her Flag Filler kaydedilmelidir. Böylece leadership kontroller ve Kingdom Cleanup sırasında gerçek Flag Filler hesaplarını normal CH25 farmlardan ayırabilir.'],
 ['Kayıt Flag Filler’ımı Kingdom Cleanup’tan korur mu?','Kayıt hesabın onaylı Flag Filler olduğunu gösterir ancak kalıcı koruma sağlamaz. Flag Filler yine de KD3903’ün tüm geçerli gereksinimlerini karşılamalıdır.'],
 ['Flag Filler Death Requirements şartlarını karşılamak zorunda mı?','Evet. Flag Filler’ın KvK sırasında deaths ile katkı sağlaması beklenir. Death Requirements şartlarını karşılamayan CH25 Flag Filler’dan kingdomdan ayrılması istenebilir.'],
 ['Death Requirements neden zorunlu?','Flag Filler savaş sırasında kingdomu desteklemek için vardır. Kingdom power ve hesap kapasitesi kullanıp bu görevi yerine getirmeyen CH25 hesap, katkı sağlayan bir Flag Filler değil gereksiz bir CH25 farmdır.'],
 ['Kaç Flag Filler kaydedebilirim?','Her Main Governor için bir aktif Flag Filler. Her Flag Filler Governor ID yalnızca bir aktif kayda ait olabilir.'],
 ['Kayıt Kodu nedir?','Kayıt sırasında oluşturulur. Kaydı yeniden adlandırmak veya silmek için gereklidir. Güvenli bir yerde saklayın.'],
 ['Main veya Flag Filler adımı değiştirdim. Ne yapmalıyım?','Rename özelliğini kullanın. İki Governor ID’yi ve Kayıt Kodunu girin, ardından bir veya iki adı güncelleyin. Governor ID’ler değişmez.'],
 ['Farklı bir Flag Filler kullanmak istiyorum. Ne yapmalıyım?','Önce mevcut kaydı silin, ardından yeni Flag Filler’ı kaydedin.'],
 ['Mevcut kaydın Governor ID’lerini değiştirebilir miyim?','Hayır. Governor ID hesapları benzersiz olarak tanımlar. Başka bir Flag Filler için mevcut kaydı silip yeni kayıt oluşturun.'],
 ['Flag Filler kaydımı silersem ne olur?','Aktif Flag Filler listesinden çıkarılır. Geçmiş kayıt leadership için idari amaçlarla saklanır.'],
 ['Kayıt Kodumu kaybettim. Ne yapmalıyım?','KD3903 leadership ile iletişime geçin. Yinelenen kayıt oluşturmayın.'],
 ['Hangi veriler saklanıyor?','Registry Main ve Flag Filler Governor ID ve adlarını, kayıt durumunu, seçilen dili ve idari zaman damgalarını saklar. Veriler KD3903 yönetimi için kullanılır.']
];

function renderFaq(){
 const box=document.getElementById('faqAccordion'); if(!box)return;
 const items=FAQS[lang]||FAQS.en;
 const icons=['♜','♟','♜','☠','♛','♙','⌘','✎','⇄','♜','♜','◆','◉'];
 box.innerHTML=items.map((x,i)=>'<details class="faq-item"><summary><span class="faq-icon">'+(icons[i]||'♛')+'</span><span class="faq-question">'+esc(x[0])+'</span><span class="faq-chevron">⌄</span></summary><div class="faq-answer">'+esc(x[1])+'</div></details>').join('');
 box.querySelectorAll('.faq-item').forEach(item=>{
   item.addEventListener('toggle',()=>{
     if(!item.open)return;
     box.querySelectorAll('.faq-item[open]').forEach(other=>{if(other!==item)other.removeAttribute('open')});
   });
 });
}
function showFaq(){

function showResult(html){const r=document.getElementById('result');r.innerHTML=html+'<button class="gold-button" onclick="this.parentElement.classList.add(\'hidden\')">'+esc(t('ok'))+'</button>';r.classList.remove('hidden');r.scrollIntoView({behavior:'smooth',block:'center'})}
function submitRegistration(){
 setBusy('registerButton',true);
 google.script.run.withSuccessHandler(r=>{setBusy('registerButton',false);showResult('<h3>✓ '+esc(t('success'))+'</h3><p>'+esc(t('saveCode'))+'</p><code>'+esc(r.removalCode)+'</code>')}).withFailureHandler(e=>{setBusy('registerButton',false);showResult('<h3>✕ Error</h3><p>'+esc(friendlyError(e))+'</p>')}).registerFlagFiller({mainId:mainId.value,mainName:mainName.value,flagId:flagId.value,flagName:flagName.value,language:lang});
}
