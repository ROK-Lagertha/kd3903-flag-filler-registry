let lang = 'en';

function t(key) {
  return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
}

function init() {
  const select = document.getElementById('language');
  [
    ['en','English'],
    ['de','Deutsch'],
    ['ru','Русский'],
    ['tr','Türkçe']
  ].forEach(item => select.add(new Option(item[1], item[0])));

  select.value = 'en';
  select.onchange = () => {
    lang = select.value;
    renderLanguage();
  };
  renderLanguage();
}

function renderLanguage() {
  document.getElementById('subtitle').textContent = t('subtitle');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
}

function showView(view) {
  ['home','registerView','renameView','removeView','result'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });

  const id =
    view === 'register' ? 'registerView' :
    view === 'rename' ? 'renameView' :
    view === 'remove' ? 'removeView' :
    view;

  document.getElementById(id).classList.remove('hidden');
}

function setBusy(buttonId, busy) {
  const button = document.getElementById(buttonId);
  if (button) button.disabled = busy;
}

function showResult(html) {
  const result = document.getElementById('result');
  result.innerHTML = html +
    '<button class="ghost" onclick="showView(\'home\')">' + escapeHtml(t('ok')) + '</button>';
  showView('result');
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function friendlyError(error) {
  const code = String((error && error.message) || error || '');
  const messages = {
    MAIN_ALREADY_REGISTERED: 'This Main Governor already has an active Flag Filler.',
    FLAG_ALREADY_REGISTERED: 'This Flag Filler is already registered.',
    MAIN_AND_FLAG_MUST_DIFFER: 'Main Governor ID and Flag Filler ID must be different.',
    INVALID_GOVERNOR_ID: 'Please enter valid numeric Governor IDs.',
    INVALID_GOVERNOR_NAME: 'Please enter valid Governor names.',
    INVALID_REMOVAL_CODE: 'The Removal Code is incorrect.',
    REMOVAL_CODE_REQUIRED: 'A Removal Code is required.',
    REGISTRATION_NOT_FOUND: 'No matching active registration was found.',
    NO_NAME_CHANGE: 'Please change at least one Governor name.'
  };
  return messages[Object.keys(messages).find(k => code.includes(k))] || code;
}

function submitRegistration() {
  setBusy('registerButton', true);

  google.script.run
    .withSuccessHandler(result => {
      setBusy('registerButton', false);
      showResult(
        '<h2>✅ ' + escapeHtml(t('success')) + '</h2>' +
        '<p>' + escapeHtml(t('saveCode')) + '</p>' +
        '<code>' + escapeHtml(result.removalCode) + '</code>'
      );
    })
    .withFailureHandler(error => {
      setBusy('registerButton', false);
      showResult('<h2>❌ Error</h2><p>' + escapeHtml(friendlyError(error)) + '</p>');
    })
    .registerFlagFiller({
      mainId: document.getElementById('mainId').value,
      mainName: document.getElementById('mainName').value,
      flagId: document.getElementById('flagId').value,
      flagName: document.getElementById('flagName').value,
      language: lang
    });
}


function submitRename() {
  setBusy('renameButton', true);

  google.script.run
    .withSuccessHandler(() => {
      setBusy('renameButton', false);
      showResult('<h2>✅ ' + escapeHtml(t('renamed')) + '</h2>');
    })
    .withFailureHandler(error => {
      setBusy('renameButton', false);
      showResult('<h2>❌ Error</h2><p>' + escapeHtml(friendlyError(error)) + '</p>');
    })
    .renameFlagFiller({
      mainId: document.getElementById('renameMainId').value,
      flagId: document.getElementById('renameFlagId').value,
      removalCode: document.getElementById('renameRemovalCode').value,
      mainName: document.getElementById('renameMainName').value,
      flagName: document.getElementById('renameFlagName').value,
      language: lang
    });
}

function submitRemoval() {
  setBusy('removeButton', true);

  google.script.run
    .withSuccessHandler(() => {
      setBusy('removeButton', false);
      showResult('<h2>✅ ' + escapeHtml(t('removed')) + '</h2>');
    })
    .withFailureHandler(error => {
      setBusy('removeButton', false);
      showResult('<h2>❌ Error</h2><p>' + escapeHtml(friendlyError(error)) + '</p>');
    })
    .removeFlagFiller({
      mainId: document.getElementById('removeMainId').value,
      flagId: document.getElementById('removeFlagId').value,
      removalCode: document.getElementById('removalCode').value,
      language: lang
    });
}
