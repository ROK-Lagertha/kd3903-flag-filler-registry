<style>
:root{--gold:#e9b43c;--gold2:#ffdc76;--ink:#050505;--panel:rgba(9,9,8,.94);--muted:#c5b58c;--line:rgba(225,170,48,.58);font-family:Georgia,"Times New Roman",serif;color:#f5e7bd;background:#050505}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:#050505;color:#f5e7bd}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0,rgba(241,166,35,.16),transparent 35%),linear-gradient(180deg,#090704,#030303 65%);z-index:-2}
.ember-layer{position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(circle,rgba(255,174,46,.7) 0 1px,transparent 1.5px);background-size:83px 91px;z-index:-1}
.page-shell{width:min(1540px,100%);margin:auto}
.hero{position:relative;min-height:360px;overflow:hidden;border-bottom:1px solid var(--line);background:#080603}
.hero-banner{width:100%;height:clamp(360px,43vw,650px);display:block;object-fit:cover;object-position:center;filter:saturate(.95) contrast(1.08) brightness(.72)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.18) 45%,#050505 100%)}
.hero-overlay{position:absolute;inset:0;z-index:2;padding:24px clamp(18px,4vw,58px);display:flex;flex-direction:column;justify-content:space-between}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px}.kingdom-chip{letter-spacing:1px;color:#f1c55d;font-size:15px}
select{width:auto;min-width:130px;background:rgba(5,5,5,.82);color:#f5d26d;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:600 14px Georgia,serif}
.hero-title{text-align:center;text-shadow:0 2px 12px #000;padding-bottom:28px}.hero-title h1{font-size:clamp(48px,7vw,92px);margin:0;color:#f4d477;letter-spacing:4px}.hero-title h2{font-size:clamp(20px,3vw,38px);letter-spacing:9px;margin:10px 0;color:#e8c86b}.hero-title p{letter-spacing:3px;color:#d7b75c;font-size:13px}
.gold-rule{height:1px;max-width:560px;margin:0 auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.intro{text-align:center;padding:20px 18px 4px;color:#cdbb8e}.intro p{margin:0 auto;max-width:900px;line-height:1.6}
.registry-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:22px clamp(16px,3vw,52px) 30px}
.action-card{position:relative;background:linear-gradient(180deg,rgba(15,13,9,.97),rgba(5,5,5,.985));border:1px solid #e2ad32;padding:28px 24px 24px;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);box-shadow:0 0 4px #f4c44d,0 0 12px rgba(244,176,39,.55),0 0 28px rgba(214,127,12,.22),inset 0 0 18px rgba(255,190,45,.06)}
.action-card:before,.action-card:after{content:"";position:absolute;inset:7px;pointer-events:none;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);border:1px solid rgba(255,211,96,.62);filter:drop-shadow(0 0 4px rgba(255,183,42,.7))}
.action-card:after{inset:12px;border-color:rgba(168,111,21,.48);filter:none}
.card-icon{text-align:center;font-size:34px;color:var(--gold2);filter:drop-shadow(0 0 8px rgba(239,177,47,.45))}
h3{text-align:center;color:#f2d36f;font-size:30px;letter-spacing:2px;margin:8px 0 4px}.action-card>p{text-align:center;color:#c9b47b;min-height:45px;line-height:1.45;margin:0 0 16px}
label{display:block;color:#d5bd7e;font-size:12px;margin:11px 0 5px;letter-spacing:.5px}
input{width:100%;padding:13px 14px;border-radius:7px;border:1px solid #6f6040;background:rgba(17,17,16,.92);color:#fff7df;font:15px system-ui,sans-serif;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,174,52,.12)}
.gold-button{width:100%;margin-top:22px;padding:14px;border:1px solid #ffd66d;border-radius:7px;background:linear-gradient(180deg,#ffd45d,#c88b17);color:#160f03;font:700 16px Georgia,serif;letter-spacing:1px;cursor:pointer;box-shadow:0 0 18px rgba(226,158,30,.18)}.gold-button:hover{filter:brightness(1.08)}.gold-button:disabled{opacity:.55;cursor:wait}.danger-gold{background:linear-gradient(180deg,#f1c24d,#b97610)}
.result-panel{margin:0 clamp(16px,3vw,52px) 30px;padding:24px;text-align:center;border:1px solid var(--line);background:#0a0907}.result-panel code{display:block;margin:16px auto;padding:15px;max-width:380px;background:#020202;border:1px solid #5c4b29;color:#ffe18a;font:700 20px monospace;letter-spacing:1px}.result-panel button{max-width:260px}
.hidden{display:none}
footer{display:flex;justify-content:space-around;gap:20px;flex-wrap:wrap;padding:20px clamp(18px,4vw,60px) 28px;border-top:1px solid rgba(214,160,42,.35);color:#bda264;font-size:12px;letter-spacing:1px}
@media(max-width:980px){.registry-grid{grid-template-columns:1fr}.action-card>p{min-height:0}.hero-title h2{letter-spacing:5px}.hero-banner{height:440px}}
@media(max-width:560px){.hero{min-height:310px}.hero-banner{height:360px}.hero-overlay{padding:16px}.hero-title{padding-bottom:14px}.hero-title h1{font-size:44px}.hero-title h2{font-size:18px;letter-spacing:3px}.hero-title p{font-size:10px;letter-spacing:1.5px}.registry-grid{padding:14px}.action-card{padding:24px 18px}.topbar{align-items:flex-start}.kingdom-chip{font-size:13px}select{min-width:110px}.intro{padding-top:14px}}

/* v0.2.1 ornate kingdom frame */
.action-card h3:before,.action-card h3:after{content:"◆";font-size:8px;color:#f6c84c;vertical-align:middle;margin:0 9px;text-shadow:0 0 8px #e59b19}
.gold-button{box-shadow:0 0 6px rgba(255,213,95,.8),0 0 20px rgba(222,143,20,.32),inset 0 1px 0 rgba(255,255,255,.32)}
@media(min-width:981px){.hero-banner{height:560px}.hero{min-height:0}.hero-title{padding-bottom:18px}}
@media(max-width:980px){
 .registry-grid{display:block}
 .action-card{margin-bottom:16px}
 .action-card:not(.mobile-open){padding-bottom:20px}
 .action-card:not(.mobile-open)>label,.action-card:not(.mobile-open)>input,.action-card:not(.mobile-open)>.gold-button{display:none}
 .action-card:not(.mobile-open)>p{margin-bottom:0}
 .action-card{cursor:pointer}
 .action-card.mobile-open{cursor:default}
}
</style>
